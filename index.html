<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Arena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .game {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    #board {
      width: min(90vw, 560px);
      height: min(90vw, 560px);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #374151;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(28px, 7vw, 58px);
      cursor: pointer;
      user-select: none;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .selected {
      outline: 4px solid #facc15;
      outline-offset: -4px;
    }

    .panel {
      width: 250px;
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
    }

    button,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button {
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin: 15px 0;
      min-height: 24px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>♟ Chess Arena</h1>

    <div class="game">

      <div id="board"></div>

      <div class="panel">

        <h2>Game</h2>

        <div id="status">
          White's turn
        </div>

        <label for="level">Computer Level</label>

        <select id="level">
          <option value="800">800 Elo</option>
          <option value="1000">1000 Elo</option>
          <option value="1200">1200 Elo</option>
          <option value="1500">1500 Elo</option>
          <option value="1800">1800 Elo</option>
          <option value="2000">2000 Elo</option>
          <option value="2200">2200+ Elo</option>
        </select>

        <button id="newGame">
          New Game
        </button>

      </div>

    </div>

  </div>

  <script>

    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const newGameButton = document.getElementById("newGame");

    const pieces = {
      br: "♜",
      bn: "♞",
      bb: "♝",
      bq: "♛",
      bk: "♚",
      bp: "♟",

      wr: "♖",
      wn: "♘",
      wb: "♗",
      wq: "♕",
      wk: "♔",
      wp: "♙"
    };

    let board = [
      ["br","bn","bb","bq","bk","bb","bn","br"],
      ["bp","bp","bp","bp","bp","bp","bp","bp"],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ["wp","wp","wp","wp","wp","wp","wp","wp"],
      ["wr","wn","wb","wq","wk","wb","wn","wr"]
    ];

    let selected = null;
    let turn = "w";

    function drawBoard() {

      boardElement.innerHTML = "";

      for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

          const square = document.createElement("div");

          square.classList.add("square");

          if ((row + col) % 2 === 0) {
            square.classList.add("light");
          } else {
            square.classList.add("dark");
          }

          if (
            selected &&
            selected.row === row &&
            selected.col === col
          ) {
            square.classList.add("selected");
          }

          const piece = board[row][col];

          if (piece) {
            square.textContent = pieces[piece];
          }

          square.addEventListener("click", () => {
            handleSquareClick(row, col);
          });

          boardElement.appendChild(square);
        }
      }
    }

    function handleSquareClick(row, col) {

      const piece = board[row][col];

      if (!selected) {

        if (piece && piece[0] === turn) {

          selected = {
            row: row,
            col: col
          };

          drawBoard();
        }

        return;
      }

      if (
        selected.row === row &&
        selected.col === col
      ) {

        selected = null;
        drawBoard();
        return;
      }

      const movingPiece =
        board[selected.row][selected.col];

      if (piece && piece[0] === turn) {

        selected = {
          row: row,
          col: col
        };

        drawBoard();
        return;
      }

      board[row][col] = movingPiece;

      board[selected.row][selected.col] = null;

      selected = null;

      turn = turn === "w" ? "b" : "w";

      updateStatus();

      drawBoard();
    }

    function updateStatus() {

      if (turn === "w") {
        statusElement.textContent = "White's turn";
      } else {
        statusElement.textContent = "Black's turn";
      }
    }

    function newGame() {

      board = [
        ["br","bn","bb","bq","bk","bb","bn","br"],
        ["bp","bp","bp","bp","bp","bp","bp","bp"],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        ["wp","wp","wp","wp","wp","wp","wp","wp"],
        ["wr","wn","wb","wq","wk","wb","wn","wr"]
      ];

      selected = null;
      turn = "w";

      updateStatus();
      drawBoard();
    }

    newGameButton.addEventListener("click", newGame);

    drawBoard();

  </script>

</body>
</html>
