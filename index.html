<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chess Platform</title>

  <!-- Chess.js: real chess rules -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 18px 10px;
      background: #0b1220;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      color: #9ca3af;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    select,
    button {
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    select {
      background: #1f2937;
      color: white;
    }

    button {
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .game-area {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .board-wrapper {
      width: min(92vw, 600px);
    }

    #board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #374151;
      border-radius: 6px;
      overflow: hidden;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .selected {
      box-shadow: inset 0 0 0 5px #facc15;
    }

    .legal::after {
      content: "";
      width: 20%;
      height: 20%;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      position: absolute;
    }

    .capture::after {
      content: "";
      width: 75%;
      height: 75%;
      border: 5px solid rgba(220, 38, 38, 0.7);
      border-radius: 50%;
      position: absolute;
    }

    .check {
      box-shadow: inset 0 0 0 5px #ef4444;
    }

    .piece {
      font-size: clamp(32px, 8vw, 62px);
      line-height: 1;
      position: relative;
      z-index: 2;
      text-shadow: 1px 2px 2px rgba(0,0,0,0.45);
    }

    .panel {
      width: min(92vw, 320px);
      background: #1f2937;
      border-radius: 12px;
      padding: 18px;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .history {
      background: #111827;
      border-radius: 8px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .history h3 {
      margin-top: 0;
    }

    .move {
      padding: 5px 0;
      border-bottom: 1px solid #374151;
      font-size: 14px;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .game-area {
        gap: 15px;
      }

      .panel {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>♟ Chess Platform</h1>
  <p>Play chess with real legal moves</p>
</header>

<div class="container">

  <div class="controls">

    <select id="level">
      <option value="800">Computer: 800</option>
      <option value="1000">Computer: 1000</option>
      <option value="1200">Computer: 1200</option>
      <option value="1500">Computer: 1500</option>
      <option value="1800">Computer: 1800</option>
      <option value="2000">Computer: 2000</option>
      <option value="2200">Computer: 2200+</option>
    </select>

    <button onclick="newGame()">New Game</button>

  </div>

  <div class="game-area">

    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="panel">

      <div id="status" class="status">
        White to move
      </div>

      <div class="history">
        <h3>Move History</h3>
        <div id="moves">
          <div class="empty">No moves yet</div>
        </div>
      </div>

    </div>

  </div>

</div>

<script>

  let game = new Chess();

  let selectedSquare = null;

  const board = document.getElementById("board");
  const statusText = document.getElementById("status");
  const movesContainer = document.getElementById("moves");

  const files = ["a", "b", "c", "d", "e", "f", "g", "h"];
  const ranks = ["8", "7", "6", "5", "4", "3", "2", "1"];

  const pieces = {

    white: {
      p: "♙",
      n: "♘",
      b: "♗",
      r: "♖",
      q: "♕",
      k: "♔"
    },

    black: {
      p: "♟",
      n: "♞",
      b: "♝",
      r: "♜",
      q: "♛",
      k: "♚"
    }

  };


  function createBoard() {

    board.innerHTML = "";

    for (let r = 0; r < 8; r++) {

      for (let c = 0; c < 8; c++) {

        const squareName = files[c] + ranks[r];

        const square = document.createElement("div");

        square.classList.add("square");

        if ((r + c) % 2 === 0) {
          square.classList.add("light");
        } else {
          square.classList.add("dark");
        }

        square.dataset.square = squareName;

        square.addEventListener("click", function() {
          handleSquareClick(squareName);
        });

        board.appendChild(square);

      }

    }

    renderBoard();

  }


  function renderBoard() {

    const squares = document.querySelectorAll(".square");

    squares.forEach(square => {

      const squareName = square.dataset.square;

      square.innerHTML = "";

      square.classList.remove(
        "selected",
        "legal",
        "capture",
        "check"
      );

      const piece = game.get(squareName);

      if (piece) {

        const pieceElement = document.createElement("span");

        pieceElement.classList.add("piece");

        pieceElement.textContent =
          pieces[piece.color === "w" ? "white" : "black"][piece.type];

        square.appendChild(pieceElement);

      }

    });


    if (selectedSquare) {

      const selectedElement =
        document.querySelector(
          `[data-square="${selectedSquare}"]`
        );

      if (selectedElement) {
        selectedElement.classList.add("selected");
      }


      const moves = game.moves({
        square: selectedSquare,
        verbose: true
      });


      moves.forEach(move => {

        const target =
          document.querySelector(
            `[data-square="${move.to}"]`
          );

        if (!target) return;

        if (move.captured) {
          target.classList.add("capture");
        } else {
          target.classList.add("legal");
        }

      });

    }


    // Highlight king when in check
    if (game.in_check()) {

      const kingColor = game.turn();

      const allSquares = files.flatMap(file =>
        ranks.map(rank => file + rank)
      );

      allSquares.forEach(squareName => {

        const piece = game.get(squareName);

        if (
          piece &&
          piece.type === "k" &&
          piece.color === kingColor
        ) {

          document
            .querySelector(`[data-square="${squareName}"]`)
            .classList.add("check");

        }

      });

    }

    updateStatus();
    updateHistory();

  }


  function handleSquareClick(square) {

    // If a piece is already selected
    if (selectedSquare) {

      // Try making move
      const moveMade = makeMove(selectedSquare, square);

      if (moveMade) {

        selectedSquare = null;

        renderBoard();

        return;

      }

      // If clicked another own piece, select it
      const piece = game.get(square);

      if (
        piece &&
        piece.color === game.turn()
      ) {

        selectedSquare = square;

        renderBoard();

        return;

      }

      selectedSquare = null;

      renderBoard();

      return;

    }


    const piece = game.get(square);

    if (!piece) return;

    // Only current player's pieces
    if (piece.color !== game.turn()) return;

    selectedSquare = square;

    renderBoard();

  }


  function makeMove(from, to) {

    let promotion = "q";

    const piece = game.get(from);

    // Pawn promotion
    if (
      piece &&
      piece.type === "p" &&
      (to[1] === "8" || to[1] === "1")
    ) {

      let choice = prompt(
        "Promote to: q = Queen, r = Rook, b = Bishop, n = Knight"
      );

      choice = (choice || "q").toLowerCase();

      if (!["q", "r", "b", "n"].includes(choice)) {
        choice = "q";
      }

      promotion = choice;

    }


    const move = game.move({
      from: from,
      to: to,
      promotion: promotion
    });


    if (!move) {
      return false;
    }

    return true;

  }


  function updateStatus() {

    if (game.game_over()) {

      if (game.in_checkmate()) {

        const winner =
          game.turn() === "w"
            ? "Black"
            : "White";

        statusText.textContent =
          "♛ Checkmate — " + winner + " wins!";

      }

      else if (game.in_stalemate()) {

        statusText.textContent =
          "½–½ Stalemate";

      }

      else if (game.is_draw()) {

        statusText.textContent =
          "½–½ Draw";

      }

      return;

    }


    if (game.in_check()) {

      statusText.textContent =
        game.turn() === "w"
          ? "⚠️ White is in check"
          : "⚠️ Black is in check";

      return;

    }


    statusText.textContent =
      game.turn() === "w"
        ? "White to move"
        : "Black to move";

  }


  function updateHistory() {

    const history = game.history();

    movesContainer.innerHTML = "";

    if (history.length === 0) {

      movesContainer.innerHTML =
        '<div class="empty">No moves yet</div>';

      return;

    }


    for (let i = 0; i < history.length; i += 2) {

      const moveElement =
        document.createElement("div");

      moveElement.classList.add("move");

      const moveNumber = (i / 2) + 1;

      const whiteMove = history[i] || "";
      const blackMove = history[i + 1] || "";

      moveElement.textContent =
        moveNumber +
        ". " +
        whiteMove +
        " " +
        blackMove;

      movesContainer.appendChild(moveElement);

    }

    movesContainer.scrollTop =
      movesContainer.scrollHeight;

  }


  function newGame() {

    game.reset();

    selectedSquare = null;

    renderBoard();

  }


  // Start
  createBoard();

</script>

</body>
</html>
