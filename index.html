<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chess Platform</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #10131a;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 650px;
    padding: 18px;
}

h1 {
    text-align: center;
    margin: 5px 0 15px;
    font-size: 28px;
}

.topbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

select,
button {
    border: 0;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    cursor: pointer;
}

select {
    flex: 1;
    background: #202631;
    color: white;
}

button {
    background: #3b82f6;
    color: white;
}

button:active {
    transform: scale(.97);
}

.status {
    text-align: center;
    min-height: 25px;
    margin-bottom: 10px;
    color: #cbd5e1;
    font-size: 15px;
}

.board {
    width: min(92vw, 600px);
    aspect-ratio: 1 / 1;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    user-select: none;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

.piece {
    font-size: clamp(31px, 9vw, 61px);
    line-height: 1;
    user-select: none;
    pointer-events: none;
    transition: transform .12s ease;
    text-shadow: 0 2px 2px rgba(0,0,0,.35);
}

.square.selected {
    box-shadow: inset 0 0 0 5px rgba(255,215,0,.75);
}

.square.lastmove {
    background: rgba(255,235,59,.42);
}

.square.check {
    background: rgba(255,60,60,.72);
}

.move-dot {
    width: 20%;
    height: 20%;
    border-radius: 50%;
    background: rgba(20,20,20,.35);
    position: absolute;
}

.capture-ring {
    position: absolute;
    width: 78%;
    height: 78%;
    border: 5px solid rgba(20,20,20,.35);
    border-radius: 50%;
}

.drag-piece {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    font-size: clamp(40px, 12vw, 70px);
    transform: translate(-50%, -50%) scale(1.12);
    filter: drop-shadow(0 12px 8px rgba(0,0,0,.4));
    transition: none;
}

.panel {
    margin-top: 15px;
    background: #181d27;
    border-radius: 12px;
    padding: 13px;
}

.moves {
    max-height: 130px;
    overflow-y: auto;
    color: #cbd5e1;
    font-family: monospace;
    font-size: 14px;
}

.thinking {
    color: #60a5fa;
}

@media (max-width: 450px) {
    .app {
        padding: 10px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>♟ Chess Platform</h1>

    <div class="topbar">

        <select id="level">
            <option value="800">800 Elo</option>
            <option value="1000">1000 Elo</option>
            <option value="1200">1200 Elo</option>
            <option value="1500" selected>1500 Elo</option>
            <option value="1800">1800 Elo</option>
            <option value="2000">2000 Elo</option>
            <option value="2200">2200 Elo</option>
        </select>

        <button id="newGame">New Game</button>

    </div>

    <div id="status" class="status">
        Your move — White
    </div>

    <div id="board" class="board"></div>

    <div class="panel">
        <strong>Moves</strong>
        <div id="moves" class="moves"></div>
    </div>

</div>

<script>

const board = document.getElementById("board");
const statusEl = document.getElementById("status");
const movesEl = document.getElementById("moves");
const levelEl = document.getElementById("level");
const newGameBtn = document.getElementById("newGame");

const game = new Chess();

let selectedSquare = null;
let legalTargets = [];

let dragging = false;
let dragPiece = null;
let dragFrom = null;

let lastMove = null;

let computerThinking = false;
let engineReady = false;

const pieceSymbols = {
    w: {
        p: "♙",
        n: "♘",
        b: "♗",
        r: "♖",
        q: "♕",
        k: "♔"
    },
    b: {
        p: "♟",
        n: "♞",
        b: "♝",
        r: "♜",
        q: "♛",
        k: "♚"
    }
};


/* =========================
   STOCKFISH ENGINE
========================= */

let engine;

function startEngine() {

    try {

        engine = new Worker(
            "stockfish/stockfish-19-lite-single.js"
        );

        engine.onmessage = function(event) {

            const line = typeof event.data === "string"
                ? event.data
                : "";

            if (line === "uciok") {

                engine.postMessage("isready");

            }

            if (line === "readyok") {

                engineReady = true;

                updateStatus();

            }

            if (line.startsWith("bestmove")) {

                const parts = line.split(" ");

                const bestMove = parts[1];

                if (bestMove && bestMove !== "(none)") {

                    makeComputerMove(bestMove);

                } else {

                    computerThinking = false;
                    updateStatus();

                }
            }
        };

        engine.onerror = function(error) {

            console.error("Stockfish error:", error);

            statusEl.textContent =
                "Stockfish failed to load. Check the stockfish folder.";

        };

        engine.postMessage("uci");

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "Could not start Stockfish.";

    }
}


/* =========================
   LEVEL SETTINGS
========================= */

function getEngineSettings() {

    const level = Number(levelEl.value);

    /*
      These are approximate playing-strength presets.
      They are NOT guaranteed official Elo ratings.
    */

    if (level <= 800) {
        return {
            skill: 1,
            time: 250
        };
    }

    if (level <= 1000) {
        return {
            skill: 3,
            time: 350
        };
    }

    if (level <= 1200) {
        return {
            skill: 5,
            time: 500
        };
    }

    if (level <= 1500) {
        return {
            skill: 8,
            time: 700
        };
    }

    if (level <= 1800) {
        return {
            skill: 12,
            time: 900
        };
    }

    if (level <= 2000) {
        return {
            skill: 15,
            time: 1200
        };
    }

    return {
        skill: 18,
        time: 1600
    };
}


/* =========================
   ASK COMPUTER
========================= */

function askComputer() {

    if (!engine || !engineReady) {

        statusEl.textContent =
            "Engine is still loading...";

        return;
    }

    if (game.game_over()) {
        return;
    }

    computerThinking = true;

    selectedSquare = null;
    legalTargets = [];

    renderBoard();

    statusEl.innerHTML =
        '<span class="thinking">Computer is thinking...</span>';

    const settings = getEngineSettings();

    engine.postMessage("stop");

    engine.postMessage("ucinewgame");

    engine.postMessage(
        "setoption name Skill Level value " +
        settings.skill
    );

    engine.postMessage(
        "position fen " + game.fen()
    );

    engine.postMessage(
        "go movetime " + settings.time
    );
}


/* =========================
   COMPUTER MOVE
========================= */

function makeComputerMove(uciMove) {

    if (!uciMove || uciMove.length < 4) {

        computerThinking = false;
        updateStatus();
        return;
    }

    const from = uciMove.substring(0, 2);
    const to = uciMove.substring(2, 4);
    const promotion = uciMove.length >= 5
        ? uciMove.substring(4, 5)
        : undefined;

    const movingPiece = game.get(from);

    if (!movingPiece) {

        computerThinking = false;
        updateStatus();
        return;
    }

    const capture = !!game.get(to);

    /*
      First make the legal move in chess.js.
    */

    const move = game.move({
        from: from,
        to: to,
        promotion: promotion || "q"
    });

    if (!move) {

        computerThinking = false;
        updateStatus();
        return;
    }

    lastMove = {
        from: from,
        to: to
    };

    renderBoard();

    /*
      Hide the destination piece temporarily.
      The floating piece will visually travel there.
    */

    const destinationSquare =
        document.querySelector(
            `[data-square="${to}"]`
        );

    if (destinationSquare) {

        const destinationPiece =
            destinationSquare.querySelector(".piece");

        if (destinationPiece) {
            destinationPiece.style.visibility = "hidden";
        }
    }

    animateComputerPiece(
        from,
        to,
        movingPiece.color,
        movingPiece.type,
        capture
    );
}


/* =========================
   COMPUTER ANIMATION
========================= */

function animateComputerPiece(
    from,
    to,
    color,
    type,
    capture
) {

    const fromSquare =
        document.querySelector(
            `[data-square="${from}"]`
        );

    const toSquare =
        document.querySelector(
            `[data-square="${to}"]`
        );

    if (!fromSquare || !toSquare) {

        finishComputerMove(capture);
        return;
    }

    const fromRect =
        fromSquare.getBoundingClientRect();

    const toRect =
        toSquare.getBoundingClientRect();

    const floating =
        document.createElement("div");

    floating.className = "drag-piece";

    floating.textContent =
        pieceSymbols[color][type];

    floating.style.left =
        (fromRect.left + fromRect.width / 2) + "px";

    floating.style.top =
        (fromRect.top + fromRect.height / 2) + "px";

    document.body.appendChild(floating);

    fromSquare.style.opacity = "0";

    const startX =
        fromRect.left + fromRect.width / 2;

    const startY =
        fromRect.top + fromRect.height / 2;

    const endX =
        toRect.left + toRect.width / 2;

    const endY =
        toRect.top + toRect.height / 2;

    const duration = 280;

    const startTime = performance.now();

    function animate(time) {

        const progress =
            Math.min(
                (time - startTime) / duration,
                1
            );

        /*
          Smooth ease-in-out movement
        */

        const eased =
            progress < .5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        floating.style.left =
            (startX + (endX - startX) * eased) + "px";

        floating.style.top =
            (startY + (endY - startY) * eased) + "px";

        if (progress < 1) {

            requestAnimationFrame(animate);

        } else {

            floating.remove();

            finishComputerMove(capture);
        }
    }

    requestAnimationFrame(animate);
}


/* =========================
   FINISH COMPUTER MOVE
========================= */

function finishComputerMove(capture) {

    computerThinking = false;

    renderBoard();

    if (capture) {
        playCaptureSound();
    }

    updateStatus();
}


/* =========================
   BOARD
========================= */

function renderBoard() {

    board.innerHTML = "";

    const orientation = "w";

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const file =
                orientation === "w"
                    ? String.fromCharCode(97 + col)
                    : String.fromCharCode(104 - col);

            const rank =
                orientation === "w"
                    ? 8 - row
                    : row + 1;

            const squareName =
                file + rank;

            const square =
                document.createElement("div");

            square.className =
                "square " +
                (((row + col) % 2 === 0)
                    ? "light"
                    : "dark");

            square.dataset.square =
                squareName;

            const piece =
                game.get(squareName);

            if (piece) {

                const pieceEl =
                    document.createElement("div");

                pieceEl.className =
                    "piece";

                pieceEl.textContent =
                    pieceSymbols[piece.color][piece.type];

                square.appendChild(pieceEl);
            }

            if (
                lastMove &&
                (
                    lastMove.from === squareName ||
                    lastMove.to === squareName
                )
            ) {

                square.classList.add("lastmove");
            }

            if (
                selectedSquare === squareName
            ) {

                square.classList.add("selected");
            }

            if (
                legalTargets.includes(squareName)
            ) {

                if (game.get(squareName)) {

                    const ring =
                        document.createElement("div");

                    ring.className =
                        "capture-ring";

                    square.appendChild(ring);

                } else {

                    const dot =
                        document.createElement("div");

                    dot.className =
                        "move-dot";

                    square.appendChild(dot);
                }
            }

            square.addEventListener(
                "pointerdown",
                handlePointerDown
            );

            square.addEventListener(
                "click",
                handleClick
            );

            board.appendChild(square);
        }
    }

    /*
      Highlight king in check.
    */

    if (game.in_check()) {

        const color =
            game.turn();

        for (const sq of allSquares()) {

            const piece = game.get(sq);

            if (
                piece &&
                piece.type === "k" &&
                piece.color === color
            ) {

                const kingSquare =
                    document.querySelector(
                        `[data-square="${sq}"]`
                    );

                if (kingSquare) {
                    kingSquare.classList.add("check");
                }
            }
        }
    }

    updateMoves();
    updateStatus();
}


/* =========================
   CLICK / TAP MOVE
========================= */

function handleClick(event) {

    if (dragging || computerThinking) {
        return;
    }

    const square =
        event.currentTarget.dataset.square;

    if (game.turn() !== "w") {
        return;
    }

    const piece =
        game.get(square);

    if (!selectedSquare) {

        if (
            piece &&
            piece.color === game.turn()
        ) {

            selectSquare(square);
        }

        return;
    }

    if (legalTargets.includes(square)) {

        tryPlayerMove(
            selectedSquare,
            square
        );

        return;
    }

    if (
        piece &&
        piece.color === game.turn()
    ) {

        selectSquare(square);

    } else {

        clearSelection();
    }
}


/* =========================
   SELECT
========================= */

function selectSquare(square) {

    selectedSquare = square;

    const moves =
        game.moves({
            square: square,
            verbose: true
        });

    legalTargets =
        moves.map(m => m.to);

    renderBoard();
}


/* =========================
   PLAYER MOVE
========================= */

function tryPlayerMove(from, to) {

    const move =
        game.move({
            from: from,
            to: to,
            promotion: "q"
        });

    if (!move) {
        return;
    }

    lastMove = {
        from: from,
        to: to
    };

    clearSelection();

    if (move.captured) {
        playCaptureSound();
    }

    renderBoard();

    if (!game.game_over()) {

        setTimeout(() => {

            if (game.turn() === "b") {
                askComputer();
            }

        }, 300);

    }
}


/* =========================
   DRAG SYSTEM
========================= */

function handlePointerDown(event) {

    if (computerThinking) {
        return;
    }

    if (game.turn() !== "w") {
        return;
    }

    const square =
        event.currentTarget.dataset.square;

    const piece =
        game.get(square);

    if (
        !piece ||
        piece.color !== game.turn()
    ) {
        return;
    }

    event.preventDefault();

    dragging = true;
    dragFrom = square;

    const moves =
        game.moves({
            square: square,
            verbose: true
        });

    legalTargets =
        moves.map(m => m.to);

    selectedSquare = square;

    const floating =
        document.createElement("div");

    floating.className =
        "drag-piece";

    floating.textContent =
        pieceSymbols[piece.color][piece.type];

    floating.style.left =
        event.clientX + "px";

    floating.style.top =
        event.clientY + "px";

    document.body.appendChild(floating);

    dragPiece = floating;

    renderBoard();

    window.addEventListener(
        "pointermove",
        handlePointerMove
    );

    window.addEventListener(
        "pointerup",
        handlePointerUp,
        { once: true }
    );
}


function handlePointerMove(event) {

    if (!dragging || !dragPiece) {
        return;
    }

    dragPiece.style.left =
        event.clientX + "px";

    dragPiece.style.top =
        event.clientY + "px";
}


function handlePointerUp(event) {

    if (!dragging) {
        return;
    }

    const target =
        document.elementFromPoint(
            event.clientX,
            event.clientY
        );

    const targetSquare =
        target?.closest(".square");

    const to =
        targetSquare?.dataset.square;

    const from =
        dragFrom;

    dragging = false;

    window.removeEventListener(
        "pointermove",
        handlePointerMove
    );

    if (
        to &&
        legalTargets.includes(to)
    ) {

        if (dragPiece) {
            dragPiece.remove();
        }

        dragPiece = null;

        tryPlayerMove(from, to);

    } else {

        animateDragBack(from);
    }
}


/* =========================
   DRAG RETURN
========================= */

function animateDragBack(from) {

    if (!dragPiece) {
        clearSelection();
        return;
    }

    const square =
        document.querySelector(
            `[data-square="${from}"]`
        );

    if (!square) {

        dragPiece.remove();
        dragPiece = null;
        clearSelection();
        return;
    }

    const rect =
        square.getBoundingClientRect();

    dragPiece.style.transition =
        "all .16s ease";

    dragPiece.style.left =
        (rect.left + rect.width / 2) + "px";

    dragPiece.style.top =
        (rect.top + rect.height / 2) + "px";

    setTimeout(() => {

        if (dragPiece) {
            dragPiece.remove();
        }

        dragPiece = null;

        clearSelection();

    }, 170);
}


/* =========================
   CLEAR
========================= */

function clearSelection() {

    selectedSquare = null;
    legalTargets = [];

    renderBoard();
}


/* =========================
   MOVES
========================= */

function updateMoves() {

    let html = "";

    const history =
        game.history();

    for (let i = 0; i < history.length; i += 2) {

        const number =
