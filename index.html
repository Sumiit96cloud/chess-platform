<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Chess Platform</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 18px 10px;
      background: #080d1a;
      border-bottom: 1px solid #20283a;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: .5px;
    }

    header p {
      margin: 5px 0 0;
      color: #8993a8;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 18px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    select,
    button {
      height: 42px;
      border: 1px solid #30394d;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 14px;
      color: white;
      background: #171e2e;
      outline: none;
    }

    button {
      background: #315bea;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .game-area {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 22px;
    }

    /*
      FIXED BOARD
      The board is always square.
      Each square is exactly 1/8 of the board.
    */

    .board-container {
      width: min(88vw, 560px);
      min-width: 320px;
      flex-shrink: 0;
    }

    #board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 5px solid #151c2c;
      border-radius: 5px;
      overflow: hidden;
      box-shadow:
        0 15px 45px rgba(0,0,0,.45),
        0 0 0 1px #3b4355;
      touch-action: none;
    }

    .square {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    /*
      PIECES
    */

    .piece {
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Arial Unicode MS",
        "Segoe UI Symbol",
        "DejaVu Sans",
        sans-serif;

      font-size: clamp(36px, 8vw, 66px);
      line-height: 1;

      user-select: none;
      -webkit-user-select: none;

      position: relative;
      z-index: 5;

      transition:
        transform .12s ease,
        filter .12s ease;
    }

    .white-piece {
      color: #fff;
      text-shadow:
        0 2px 0 #777,
        1px 3px 4px rgba(0,0,0,.55);
    }

    .black-piece {
      color: #151515;
      text-shadow:
        0 2px 1px rgba(255,255,255,.2),
        1px 3px 4px rgba(0,0,0,.65);
    }

    .square:hover .piece {
      transform: scale(1.04);
    }

    /*
      SELECTED SQUARE
    */

    .selected {
      box-shadow: inset 0 0 0 5px #f7d046;
    }

    /*
      LEGAL MOVE DOT
    */

    .legal::after {
      content: "";
      position: absolute;
      width: 24%;
      height: 24%;
      border-radius: 50%;
      background: rgba(30, 30, 30, .42);
      z-index: 3;
    }

    /*
      CAPTURE
    */

    .capture::after {
      content: "";
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      border: 5px solid rgba(180, 35, 35, .65);
      z-index: 3;
    }

    /*
      CHECK
    */

    .check {
      box-shadow:
        inset 0 0 0 5px #e53935,
        inset 0 0 25px rgba(255,0,0,.45);
    }

    /*
      LAST MOVE
    */

    .last-move {
      background-image:
        linear-gradient(
          rgba(255, 220, 60, .28),
          rgba(255, 220, 60, .28)
        );
    }

    /*
      SIDE PANEL
    */

    .panel {
      width: 310px;
      flex-shrink: 0;
      background: #151c2b;
      border: 1px solid #283248;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .status-box {
      background: #0d1422;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .status-title {
      font-size: 12px;
      color: #8791a6;
      margin-bottom: 5px;
    }

    #status {
      font-size: 18px;
      font-weight: bold;
    }

    .history {
      background: #0d1422;
      border-radius: 10px;
      padding: 13px;
    }

    .history h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #moves {
      max-height: 310px;
      overflow-y: auto;
    }

    .move-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr;
      padding: 7px 5px;
      border-bottom: 1px solid #20293a;
      font-size: 14px;
    }

    .move-number {
      color: #737e95;
    }

    .empty {
      color: #6f7a90;
      font-size: 13px;
    }

    /*
      DRAGGING
    */

    .dragging {
      opacity: .45;
      transform: scale(1.08);
    }

    /*
      MOBILE
    */

    @media (max-width: 760px) {

      .container {
        padding: 12px 8px 25px;
      }

      .game-area {
        flex-direction: column;
        align-items: center;
      }

      .board-container {
        width: min(94vw, 560px);
        min-width: 0;
      }

      .panel {
        width: min(94vw, 560px);
      }

      #moves {
        max-height: 180px;
      }
    }

    @media (max-width: 380px) {

      header h1 {
        font-size: 21px;
      }

      .board-container {
        width: 96vw;
      }

      .piece {
        font-size: 39px;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>♟ Chess Platform</h1>
  <p>Play chess • Learn • Improve</p>
</header>

<div class="container">

  <div class="controls">

    <select id="level">
      <option value="800">Computer • 800</option>
      <option value="1000">Computer • 1000</option>
      <option value="1200">Computer • 1200</option>
      <option value="1500">Computer • 1500</option>
      <option value="1800">Computer • 1800</option>
      <option value="2000">Computer • 2000</option>
      <option value="2200">Computer • 2200+</option>
    </select>

    <button onclick="newGame()">New Game</button>

  </div>

  <div class="game-area">

    <div class="board-container">
      <div id="board"></div>
    </div>

    <div class="panel">

      <div class="status-box">
        <div class="status-title">GAME STATUS</div>
        <div id="status">White to move</div>
      </div>

      <div class="history">
        <h3>Move History</h3>

        <div id="moves">
          <div class="empty">
            No moves yet
          </div>
        </div>

      </div>

    </div>

  </div>

</div>

<script>

  let game = new Chess();

  let selectedSquare = null;
  let draggedSquare = null;

  let lastMove = null;

  const board = document.getElementById("board");
  const statusText = document.getElementById("status");
  const movesContainer = document.getElementById("moves");

  const files = ["a","b","c","d","e","f","g","h"];
  const ranks = ["8","7","6","5","4","3","2","1"];

  const pieces = {

    w: {
      p: "♙",
      n: "♘",
      b: "♗",
      r: "♖",
      q: "♕",
      k: "♔"
    },

    b: {
      p: "♟",
      n: "♞",
      b: "♝",
      r: "♜",
      q: "♛",
      k: "♚"
    }

  };


  /*
    CREATE BOARD
  */

  function createBoard() {

    board.innerHTML = "";

    for (let r = 0; r < 8; r++) {

      for (let c = 0; c < 8; c++) {

        const squareName =
          files[c] + ranks[r];

        const square =
          document.createElement("div");

        square.className = "square";

        square.classList.add(
          (r + c) % 2 === 0
            ? "light"
            : "dark"
        );

        square.dataset.square =
          squareName;

        /*
          NORMAL TAP
        */

        square.addEventListener(
          "click",
          () => handleSquareClick(squareName)
        );


        /*
          TOUCH DRAG
        */

        square.addEventListener(
          "pointerdown",
          handlePointerDown
        );

        square.addEventListener(
          "pointerup",
          handlePointerUp
        );

        board.appendChild(square);

      }

    }

    renderBoard();

  }


  /*
    DRAW PIECES
  */

  function renderBoard() {

    const squares =
      document.querySelectorAll(".square");

    squares.forEach(square => {

      const squareName =
        square.dataset.square;

      square.innerHTML = "";

      square.classList.remove(
        "selected",
        "legal",
        "capture",
        "check",
        "last-move"
      );

      /*
        Last move highlight
      */

      if (
        lastMove &&
        (
          squareName === lastMove.from ||
          squareName === lastMove.to
        )
      ) {
        square.classList.add("last-move");
      }


      const piece =
        game.get(squareName);

      if (piece) {

        const pieceElement =
          document.createElement("span");

        pieceElement.classList.add("piece");

        pieceElement.classList.add(
          piece.color === "w"
            ? "white-piece"
            : "black-piece"
        );

        pieceElement.textContent =
          pieces[piece.color][piece.type];

        /*
          Drag support
        */

        pieceElement.addEventListener(
          "pointerdown",
          function(event) {

            if (
              piece.color !== game.turn() ||
              game.game_over()
            ) {
              return;
            }

            event.stopPropagation();

            draggedSquare =
              squareName;

            selectedSquare =
              squareName;

            pieceElement.classList.add(
              "dragging"
            );

            renderBoard();

          }
        );

        square.appendChild(pieceElement);

      }

    });


    /*
      Selected square
    */

    if (selectedSquare) {

      const selected =
        document.querySelector(
          `[data-square="${selectedSquare}"]`
        );

      if (selected) {
        selected.classList.add("selected");
      }


      const legalMoves =
        game.moves({
          square: selectedSquare,
          verbose: true
        });


      legalMoves.forEach(move => {

        const target =
          document.querySelector(
            `[data-square="${move.to}"]`
          );

        if (!target) return;

        if (move.captured) {
          target.classList.add("capture");
        } else {
          target.classList.add("legal");
        }

      });

    }


    /*
      Check highlight
    */

    if (game.in_check()) {

      const kingColor =
        game.turn();

      files.forEach(file => {

        ranks.forEach(rank => {

          const squareName =
            file + rank;

          const piece =
            game.get(squareName);

          if (
            piece &&
            piece.type === "k" &&
            piece.color === kingColor
          ) {

            const kingSquare =
              document.querySelector(
                `[data-square="${squareName}"]`
              );

            if (kingSquare) {
              kingSquare.classList.add("check");
            }

          }

        });

      });

    }


    updateStatus();
    updateHistory();

  }


  /*
    TAP / CLICK
  */

  function handleSquareClick(square) {

    if (game.game_over()) {
      return;
    }


    /*
      If a piece is selected,
      try to move it.
    */

    if (selectedSquare) {

      if (
        tryMove(
          selectedSquare,
          square
        )
      ) {

        selectedSquare = null;
        renderBoard();
        return;

      }


      /*
        Select another own piece
      */

      const piece =
        game.get(square);

      if (
        piece &&
        piece.color === game.turn()
      ) {

        selectedSquare = square;
        renderBoard();
        return;

      }


      selectedSquare = null;
      renderBoard();

      return;

    }


    /*
      Select piece
    */

    const piece =
      game.get(square);

    if (!piece) return;

    if (
      piece.color !== game.turn()
    ) {
      return;
    }

    selectedSquare = square;

    renderBoard();

  }


  /*
    POINTER DOWN
  */

  function handlePointerDown(event) {

    const square =
      event.currentTarget.dataset.square;

    const piece =
      game.get(square);

    if (
      !piece ||
      piece.color !== game.turn() ||
      game.game_over()
    ) {
      return;
    }

    draggedSquare = square;
    selectedSquare = square;

    renderBoard();

  }


  /*
    POINTER UP
  */

  function handlePointerUp(event) {

    if (!draggedSquare) {
      return;
    }

    const targetSquare =
      event.currentTarget.dataset.square;

    const from =
      draggedSquare;

    draggedSquare = null;

    if (
      tryMove(
        from,
        targetSquare
      )
    ) {

      selectedSquare = null;

    } else {

      /*
        If failed, keep selected
        so user can tap destination.
      */

      selectedSquare = from;

    }

    renderBoard();

  }


  /*
    MAKE LEGAL MOVE
  */

  function tryMove(from, to) {

    if (
      !from ||
      !to ||
      from === to
    ) {
      return false;
    }


    const piece =
      game.get(from);

    if (!piece) {
      return false;
    }


    /*
      Promotion
    */

    let promotion = "q";

    if (
      piece.type === "p" &&
      (
        to[1] === "8" ||
        to[1] === "1"
      )
    ) {

      let answer =
        prompt(
          "Promote to:\n\n" +
          "q = Queen\n" +
          "r = Rook\n" +
          "b = Bishop\n" +
          "n = Knight"
        );

      answer =
        (answer || "q").toLowerCase();

      if (
        !["q","r","b","n"]
          .includes(answer)
      ) {
        answer = "q";
      }

      promotion = answer;

    }


    const move =
      game.move({
        from: from,
        to: to,
        promotion: promotion
      });


    if (!move) {
      return false;
    }


    lastMove = {
      from: from,
      to: to
    };


    return true;

  }


  /*
    STATUS
  */

  function updateStatus() {

    if (game.in_checkmate()) {

      const winner =
        game.turn() === "w"
          ? "Black"
          : "White";

      statusText.textContent =
        "♛ Checkmate — " +
        winner +
        " wins";

      return;

    }


    if (game.in_stalemate()) {

      statusText.textContent =
        "½–½ Stalemate";

      return;

    }


    if (game.is_draw()) {

      statusText.textContent =
        "½–½ Draw";

      return;

    }


    if (game.in_check()) {

      statusText.textContent =
        game.turn() === "w"
          ? "⚠️ White is in check"
          : "⚠️ Black is in check";

      return;

    }


    statusText.textContent =
      game.turn() === "w"
        ? "White to move"
        : "Black to move";

  }


  /*
    MOVE HISTORY
  */

  function updateHistory() {

    const history =
      game.history();

    movesContainer.innerHTML = "";


    if (history.length === 0) {

      movesContainer.innerHTML =
        '<div class="empty">No moves yet</div>';

      return;

    }


    for (
      let i = 0;
      i < history.length;
      i += 2
    ) {

      const row =
        document.createElement("div");

      row.className =
        "move-row";


      const number =
        document.createElement("div");

      number.className =
        "move-number";

      number.textContent =
        (i / 2 + 1) + ".";


      const white =
        document.createElement("div");

      white.textContent =
        history[i] || "";


      const black =
        document.createElement("div");

      black.textContent =
        history[i + 1] || "";


      row.appendChild(number);
      row.appendChild(white);
      row.appendChild(black);

      movesContainer.appendChild(row);

    }


    movesContainer.scrollTop =
      movesContainer.scrollHeight;

  }


  /*
    NEW GAME
  */

  function newGame() {

    game.reset();

    selectedSquare = null;
    draggedSquare = null;
    lastMove = null;

    renderBoard();

  }


  /*
    START
  */

  createBoard();

</script>

</body>
</html>
